name: container
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/blue-flag-666/shtech-webchat2api
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.8.2'
      - run: node --test
  image-test:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: shtech-webchat2api:test
          load: true
      - run: docker run --rm --platform linux/${{ matrix.arch }} --entrypoint node -v "$PWD:/tests:ro" -w /tests shtech-webchat2api:test --test
      - name: Check packaged service
        run: |
          docker run -d --name proxy --platform linux/${{ matrix.arch }} -e API_KEY=ci-local-key -p 127.0.0.1:8787:8787 shtech-webchat2api:test
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/healthz; then exit 0; fi
            sleep 2
          done
          docker logs proxy
          exit 1
      - if: always()
        name: Report image footprint
        run: |
          echo '### linux/${{ matrix.arch }} image' >> "$GITHUB_STEP_SUMMARY"
          docker image inspect shtech-webchat2api:test --format 'Uncompressed image bytes: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
          docker stats --no-stream --format 'Idle container memory: {{.MemUsage}}' proxy >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker rm -f proxy || true
  publish:
    needs: image-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
