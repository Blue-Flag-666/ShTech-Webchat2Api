name: container
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/blue-flag-666/shtech-webchat2api
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.8.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit tests
        shell: bash
        run: |
          set +e
          node --test > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ "$status" -ne 0 ]; then
            details=$(grep -E -A 24 -B 4 'not ok|AssertionError|ERR_' test-output.txt | tail -c 6000 | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::error title=Unit test details::$details"
          fi
          exit "$status"
      - run: npm run test:sdk
  image-test:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: shtech-webchat2api:test
          load: true
      - name: Check packaged server syntax
        run: docker run --rm --platform linux/${{ matrix.arch }} --entrypoint node shtech-webchat2api:test --check /app/server.cjs
      - name: Check packaged service
        run: |
          docker run -d --name proxy --platform linux/${{ matrix.arch }} -e API_KEY=ci-local-key -e GENAI_TOKEN=ci-placeholder-token -p 127.0.0.1:8787:8787 shtech-webchat2api:test
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/healthz; then exit 0; fi
            sleep 2
          done
          docker logs proxy
          exit 1
      - if: always()
        name: Report image footprint
        run: |
          if ! IMAGE_BYTES=$(docker image inspect shtech-webchat2api:test --format '{{.Size}}'); then
            echo "linux/${{ matrix.arch }} image was not produced"
            exit 0
          fi
          IDLE_MEMORY=$(docker stats --no-stream --format '{{.MemUsage}}' proxy 2>/dev/null || echo unavailable)
          echo "linux/${{ matrix.arch }} uncompressed image bytes: $IMAGE_BYTES"
          echo "linux/${{ matrix.arch }} idle container memory: $IDLE_MEMORY"
          echo '### linux/${{ matrix.arch }} image' >> "$GITHUB_STEP_SUMMARY"
          echo "Uncompressed image bytes: $IMAGE_BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "Idle container memory: $IDLE_MEMORY" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker rm -f proxy || true
  cli:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: shtech-webchat2api-windows-x64.exe
          - runner: windows-11-arm
            artifact: shtech-webchat2api-windows-arm64.exe
          - runner: ubuntu-24.04
            artifact: shtech-webchat2api-linux-x64
          - runner: ubuntu-24.04-arm
            artifact: shtech-webchat2api-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.8.2'
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: dist/${{ matrix.artifact }}
          archive: false
  publish:
    needs: image-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release-cli:
    needs: cli
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          pattern: shtech-webchat2api-*
          path: release
          merge-multiple: true
      - run: |
          cp THIRD_PARTY_LICENSES/Node.js.txt release/Node.js-LICENSE.txt
          cp THIRD_PARTY_LICENSES/unpdf.txt release/unpdf-LICENSE.txt
          cp THIRD_PARTY_LICENSES/fflate.txt release/fflate-LICENSE.txt
      - run: cd release && sha256sum * > SHA256SUMS.txt
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
