services:
  shtech-webchat-api:
    image: ghcr.io/blue-flag-666/shtech-webchat2api:latest
    build: .
    restart: unless-stopped
    stop_grace_period: 10s
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
